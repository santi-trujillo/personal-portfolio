<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santiago Trujillo | Portafolio</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <main class="nx-portfolio-wrapper">
    <!-- Orbes -->
    <div class="nx-orb nx-orb-orange"></div>
    <div class="nx-orb nx-orb-purple"></div>

    <!-- Contenedor Móvil Fluido -->
    <section class="nx-mobile-frame">
      <!-- Avatar -->
      <div class="nx-avatar-box"></div>
      
      <!-- Tarjeta Base Superior (Bio + Menú) -->
      <article class="nx-base-card">
        
        <!-- Contenedores Internos (Wireframes Temporales) -->
        <div class="nx-wireframe-header"></div>
        
        <div class="nx-wireframe-stats">
          <div class="nx-wireframe-stat-box"></div>
          <div class="nx-wireframe-stat-box"></div>
          <div class="nx-wireframe-stat-box"></div>
          <div class="nx-wireframe-stat-box"></div>
        </div>
        
        <div class="nx-wireframe-bio">
          <div class="nx-wireframe-bio-line" style="width: 100%;"></div>
          <div class="nx-wireframe-bio-line" style="width: 85%;"></div>
          <div class="nx-wireframe-bio-line" style="width: 90%;"></div>
        </div>
        
        <!-- Menú de Navegación Central (INTERNO) -->
        <nav class="nx-nav-menu">
          <button class="nx-nav-item nx-active" data-target="view-general">General</button>
          <button class="nx-nav-item" data-target="view-dev">Dev</button>
          <button class="nx-nav-item" data-target="view-pm">PM</button>
          <button class="nx-nav-item" data-target="view-design">Diseño</button>
        </nav>
      </article>

      <!-- CONTENEDOR MAESTRO DE VISTAS -->
      <div class="nx-views-container">
        
        <!-- VISTA 1: General (Hub Principal - ACTIVA POR DEFECTO) -->
        <div id="view-general" class="nx-view nx-active-view">
          <!-- Bento Grid Fluido (Panel de Redes y Contacto) -->
          <div class="nx-bento-grid">
            <!-- Fila 1: WhatsApp y Correo -->
            <div class="nx-box nx-box-wa"></div>
            <div class="nx-box nx-box-correo"></div>
            
            <!-- Fila 2: GitHub (Full width) -->
            <div class="nx-box nx-box-github"></div>
            
            <!-- Fila 3: Filiustec y Notbook (Asimétrica) -->
            <div class="nx-bento-row-asym">
              <div class="nx-box nx-box-filiustec"></div>
              <div class="nx-box nx-box-notbook"></div>
            </div>

            <!-- Fila 4: Instagram y Facebook -->
            <div class="nx-bento-row-social">
              <div class="nx-box nx-box-ig"></div>
              <div class="nx-box nx-box-fb"></div>
            </div>
          </div>
        </div>

        <!-- VISTA 2: Dev (Proyectos de Desarrollo) -->
        <div id="view-dev" class="nx-view">
          <div class="nx-dev-stack">
            
            <!-- Tarjeta de Proyecto 1 -->
            <div class="nx-project-card">
              <!-- Imagen del proyecto (Wireframe) -->
              <div class="nx-project-image-placeholder"></div>
              
              <!-- Panel de Detalles (Oculto, se desliza hacia arriba) -->
              <div class="nx-project-details-overlay">
                <div class="nx-wireframe-bio-line" style="width: 40%; height: 1.5rem; margin-bottom: 1rem;"></div>
                <div class="nx-wireframe-bio-line" style="width: 100%;"></div>
                <div class="nx-wireframe-bio-line" style="width: 85%;"></div>
                <div class="nx-wireframe-bio-line" style="width: 60%;"></div>
              </div>

              <!-- Botón Trigger Circular (Estilo App Nativa) -->
              <button class="nx-project-toggle-btn"></button>
            </div>

            <!-- Tarjeta de Proyecto 2 -->
            <div class="nx-project-card">
              <div class="nx-project-image-placeholder"></div>
              
              <div class="nx-project-details-overlay">
                <div class="nx-wireframe-bio-line" style="width: 50%; height: 1.5rem; margin-bottom: 1rem;"></div>
                <div class="nx-wireframe-bio-line" style="width: 90%;"></div>
                <div class="nx-wireframe-bio-line" style="width: 95%;"></div>
              </div>

              <button class="nx-project-toggle-btn"></button>
            </div>

          </div>
        </div>

        <!-- VISTA 3: PM (Tablero Gerencial) -->
        <div id="view-pm" class="nx-view">
          <!-- Wireframe temporal -->
          <div class="nx-wireframe-box" style="height: 250px;"></div>
        </div>

        <!-- VISTA 4: Diseño (Galería Creativa) -->
        <div id="view-design" class="nx-view">
          <!-- Wireframe temporal -->
          <div class="nx-wireframe-box" style="height: 400px;"></div>
        </div>

      </div>
    </section>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
